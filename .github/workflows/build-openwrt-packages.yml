name: Build OpenWRT packages

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        required: true
        type: string
      sdk_version:
        required: true
        type: string
      target:
        required: true
        type: string
      architecture:
        required: true
        type: string
      package_type:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:${{ inputs.target }}-${{ inputs.sdk_version }}
      options: --user root

    steps:
      - uses: actions/checkout@v7

      - name: 同步版本号
        run: |
          bash scripts/sync-version.sh "${{ inputs.version }}-r${{ inputs.release }}"

      - name: 缓存 GPG 密钥环
        id: cache-gnupg
        uses: actions/cache@v6
        with:
          path: /github/home/.gnupg
          key: openwrt-gnupg-keys-v1

      - name: 导入 OpenWrt GPG 公钥
        if: steps.cache-gnupg.outputs.cache-hit != 'true'
        run: |
          gpg --keyserver keyserver.ubuntu.com --recv-keys \
            0xCD84BCED626471F1 \
            0x1D53D1877742E911 \
            0xCD54E82DADB3684D \
            0x28A39BC32074BE7A \
            0x88CA59E88F681580

      - name: 缓存 feeds 索引
        id: cache-feeds
        uses: actions/cache@v6
        with:
          path: /builder/feeds/
          key: openwrt-feeds-${{ inputs.sdk_version }}

      - name: 缓存源码下载与 host 工具
        id: cache-buildcache
        uses: actions/cache@v6
        with:
          path: |
            /builder/dl/
            /builder/staging_dir/host/
            /builder/staging_dir/hostpkg/
          key: openwrt-buildcache-${{ inputs.sdk_version }}

      - name: 初始化 SDK
        run: |
          cd /builder
          [ -f ./setup.sh ] && ./setup.sh
          make defconfig

      - name: 准备构建环境
        if: steps.cache-buildcache.outputs.cache-hit != 'true'
        run: |
          cd /builder
          scripts/feeds update base
          scripts/feeds update packages
          scripts/feeds install curl
          cat $GITHUB_WORKSPACE/ci/openwrt/all.config >> .config
          make defconfig

      - name: 编译 libcurl
        if: steps.cache-buildcache.outputs.cache-hit != 'true'
        run: |
          cd /builder
          make package/curl/compile -j$(nproc)

      - name: 编译 esurfingclient
        run: |
          cp -r $GITHUB_WORKSPACE/esurfingclient /builder/package/
          cd /builder
          scripts/feeds install esurfingclient
          make package/esurfingclient/compile -j$(nproc)
          find bin/packages -name "esurfingclient*.${{ inputs.package_type }}" \
            -exec cp {} $GITHUB_WORKSPACE/esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}.${{ inputs.package_type }} \;

      - name: OpenWRT APK 包签名
        if: inputs.package_type == 'apk'
        run: |
          cd /builder
          cat > /tmp/openwrt-apk-private-key.pem << 'EOF'
          ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
          EOF
          chmod 600 /tmp/openwrt-apk-private-key.pem
          staging_dir/host/bin/apk adbsign --allow-untrusted \
            --sign-key /tmp/openwrt-apk-private-key.pem \
            $GITHUB_WORKSPACE/esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}.${{ inputs.package_type }}

      - name: 上传工件
        uses: actions/upload-artifact@v7
        with:
          name: esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}-${{ inputs.package_type }}
          path: esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}.${{ inputs.package_type }}
          retention-days: 30