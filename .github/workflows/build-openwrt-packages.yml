name: Build OpenWRT packages

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        required: true
        type: string
      sdk_version:
        required: true
        type: string
      target:
        required: true
        type: string
      architecture:
        required: true
        type: string
      package_type:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:${{ inputs.target }}-${{ inputs.sdk_version }}

    steps:
      - uses: actions/checkout@v7

      - name: 同步版本号
        run: |
          bash scripts/sync-version.sh "${{ inputs.version }}-r${{ inputs.release }}"

      - name: 初始化 SDK
        run: |
          cd /home/build/openwrt
          [ -f ./setup.sh ] && ./setup.sh
          make defconfig

      - name: 获取 OpenWrt 缓存
        id: cache-openwrt
        uses: actions/cache@v6
        with:
          path: |
            /home/build/openwrt/staging_dir/
            /home/build/openwrt/dl/
          key: openwrt-${{ inputs.architecture }}-${{ inputs.package_type }}-${{ inputs.sdk_version }}

      - name: 准备构建配置
        if: steps.cache-openwrt.outputs.cache-hit != 'true'
        run: |
          cd /home/build/openwrt
          scripts/feeds update base
          scripts/feeds update packages
          scripts/feeds install curl
          cat $GITHUB_WORKSPACE/ci/openwrt/all.config >> .config
          make defconfig

      - name: 编译 libcurl
        if: steps.cache-openwrt.outputs.cache-hit != 'true'
        run: |
          cd /home/build/openwrt
          make package/curl/compile -j$(nproc)

      - name: 编译 esurfingclient
        run: |
          cp -r $GITHUB_WORKSPACE/esurfingclient /home/build/openwrt/package/
          cd /home/build/openwrt
          scripts/feeds install esurfingclient
          make package/esurfingclient/compile -j$(nproc)
          find bin/packages -name "esurfingclient*.${{ inputs.package_type }}" \
            -exec cp {} $GITHUB_WORKSPACE/esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}.${{ inputs.package_type }} \;

      - name: OpenWRT APK 包签名
        if: inputs.package_type == 'apk'
        run: |
          cd /home/build/openwrt
          cat > /tmp/openwrt-apk-private-key.pem << 'EOF'
          ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
          EOF
          chmod 600 /tmp/openwrt-apk-private-key.pem
          staging_dir/host/bin/apk adbsign --allow-untrusted \
            --sign-key /tmp/openwrt-apk-private-key.pem \
            $GITHUB_WORKSPACE/esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}.${{ inputs.package_type }}

      - name: 上传工件
        uses: actions/upload-artifact@v7
        with:
          name: esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}-${{ inputs.package_type }}
          path: esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}.${{ inputs.package_type }}
          retention-days: 30