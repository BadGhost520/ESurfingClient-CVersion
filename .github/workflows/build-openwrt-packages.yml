name: Build OpenWrt packages

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        required: true
        type: string
      sdk_version:
        required: true
        type: string
      target:
        required: true
        type: string
      architecture:
        required: true
        type: string
      package_type:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:13

    steps:
      - uses: actions/checkout@v7

      - name: 更新 Makefile 版本号
        run: |
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=${{ inputs.version }}/" esurfingclient/Makefile
          sed -i "s/PKG_RELEASE:=.*/PKG_RELEASE:=${{ inputs.release }}/" esurfingclient/Makefile

      - name: 安装软件包 (最多重试 3 次)
        run: |
          PACKAGES="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev rsync wget ca-certificates unzip file zstd python3-setuptools swig"
          
          for i in 1 2 3; do
            echo "尝试 $i: 正在安装 $PACKAGES"
            if apt-get update && apt-get install -y $PACKAGES; then
              echo "所有软件包已完成安装"
              break
            fi
            echo "尝试 $i 失败"
            sleep 3
          done

      - name: 获取 OpenWrt SDK 压缩包缓存
        id: cache-openwrt-sdk
        uses: actions/cache@v6
        with:
          path: |
            openwrt-sdk.tar.zst
          key: openwrt-${{ inputs.architecture }}-${{ inputs.package_type }}-sdk-${{ inputs.sdk_version }}

      - name: 下载 SDK
        if: steps.cache-openwrt-sdk.outputs.cache-hit != 'true'
        run: |
          BASE="https://downloads.openwrt.org/releases/${{ inputs.sdk_version }}/targets/${{ inputs.target }}"
          FILE=$(curl -s "$BASE/" | grep -oE 'openwrt-sdk-[^"<]+\.tar\.zst' | head -n1)
          
          wget -O openwrt-sdk.tar.zst "$BASE/$FILE"

      - name: 解压 SDK
        run: |
          mkdir -p openwrt-sdk
          
          tar --zstd -xf openwrt-sdk.tar.zst -C openwrt-sdk --strip-components=1

      - name: 初始化 SDK
        run: |
          cd openwrt-sdk

          make defconfig

      - name: 获取 OpenWrt 缓存
        id: cache-openwrt
        uses: actions/cache@v6
        with:
          path: |
            openwrt-sdk/staging_dir/
            openwrt-sdk/dl/
          key: openwrt-${{ inputs.architecture }}-${{ inputs.package_type }}-${{ inputs.sdk_version }}

      - name: 准备构建配置
        if: steps.cache-openwrt.outputs.cache-hit != 'true'
        run: |
          cd openwrt-sdk

          scripts/feeds update base
          scripts/feeds update packages
          
          scripts/feeds install curl
          
          cat ../openwrt-config/all.config >> .config

          make defconfig

      - name: 编译 libcurl
        if: steps.cache-openwrt.outputs.cache-hit != 'true'
        run: |
          cd openwrt-sdk
          make package/curl/compile -j$(nproc)

      - name: 编译 esurfingclient
        run: |
          cp -r esurfingclient openwrt-sdk/package/
          
          cd openwrt-sdk
          
          scripts/feeds install esurfingclient
          
          make package/esurfingclient/compile -j$(nproc)

          find bin/packages -name "esurfingclient*.${{ inputs.package_type }}" -exec cp {} ../esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}.${{ inputs.package_type }} \;

      - name: 上传工件
        uses: actions/upload-artifact@v7
        with:
          name: esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}-${{ inputs.package_type }}
          path: esurfingclient_${{ inputs.version }}-${{ inputs.release }}_${{ inputs.architecture }}.${{ inputs.package_type }}
          retention-days: 30
