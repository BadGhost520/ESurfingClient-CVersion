name: Build Desktop aarch64 macOS Binary

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_version:
        required: true
        type: string
      curl_version:
        required: true
        type: string
      tail_wind_labs_version:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: 准备安装目录
        run: |
          sudo mkdir -p /usr/local/opt/openssl-built
          sudo mkdir -p /usr/local/opt/curl-built
          sudo chown -R $(whoami) /usr/local/opt/openssl-built
          sudo chown -R $(whoami) /usr/local/opt/curl-built

      - name: 安装编译工具
        run: |
          brew install make upx binutils

      - name: 获取 libcurl 缓存
        id: cache-curl
        uses: actions/cache@v6
        with:
          path: /usr/local/opt/curl-built
          key: curl-${{ inputs.curl_version }}-macos-aarch64

      - name: 构建 libcurl 静态链接库
        if: steps.cache-curl.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget https://curl.se/download/curl-${{ inputs.curl_version }}.tar.gz
          tar -xzf curl-${{ inputs.curl_version }}.tar.gz
          cd curl-${{ inputs.curl_version }}

          ./configure \
            --prefix=/usr/local/opt/curl-built \
            --enable-static \
            --disable-shared \
            --without-ssl \
            --enable-http --enable-proxy --enable-cookies \
            --enable-basic-auth --enable-digest-auth \
            --disable-ftp --disable-file --disable-ldap --disable-ldaps \
            --disable-rtsp --disable-dict --disable-telnet --disable-tftp \
            --disable-pop3 --disable-imap --disable-smb --disable-smtp \
            --disable-gopher --disable-mqtt --disable-websockets \
            --disable-bearer-auth --disable-kerberos-auth --disable-negotiate-auth \
            --disable-ntlm --disable-tls-srp --disable-aws --disable-rtmp \
            --without-brotli --without-zstd --without-libpsl --without-libssh2 \
            --without-librtmp --without-libidn2 --without-nghttp2 \
            --without-ngtcp2 --without-nghttp3 --without-quiche --without-msh3 \
            --without-libgsasl --without-libssh --without-wolfssh --without-hyper \
            --without-zlib \
            --disable-ares --disable-rt --disable-threaded-resolver \
            --disable-ipv6 --disable-unix-sockets \
            --disable-manual --disable-docs --disable-verbose --disable-versioned-symbols \
            LDFLAGS="-framework CoreFoundation -framework SystemConfiguration" \
            CC=clang

          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: 构建 ESurfingClient 程序
        run: |
          export CMAKE_PREFIX_PATH=/usr/local/opt/openssl-built:/usr/local/opt/curl-built:$CMAKE_PREFIX_PATH
          export PKG_CONFIG_PATH=/usr/local/opt/curl-built/lib/pkgconfig:$PKG_CONFIG_PATH

          cd esurfingclient/main

          cmake -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DOPENSSL_ROOT_DIR=/usr/local/opt/openssl-built \
            -DCURL_INCLUDE_DIR=/usr/local/opt/curl-built/include \
            -DCURL_LIBRARY=/usr/local/opt/curl-built/lib/libcurl.a \
            -B build \
            -S .

          cmake --build build -j$(sysctl -n hw.logicalcpu)

          cp build/ESurfingClient ../../ESurfingClient-${{ inputs.full_version }}-darwin-aarch64

          upx --best --lzma ../../ESurfingClient-${{ inputs.full_version }}-darwin-aarch64 || true

          ls -lh ../../ESurfingClient-${{ inputs.full_version }}-darwin-aarch64

      - name: 验证
        run: |
          if [ -f "ESurfingClient-${{ inputs.full_version }}-darwin-aarch64" ]; then
            echo "构建成功"
            echo "文件大小: $(du -h ESurfingClient-${{ inputs.full_version }}-darwin-aarch64 | cut -f1)"
            file ESurfingClient-${{ inputs.full_version }}-darwin-aarch64
          else
            echo "未找到二进制文件"
            exit 1
          fi

      - name: 获取 web 处理缓存
        id: cache-web
        uses: actions/cache@v6
        with:
          path: tailwindcss-macos-aarch64
          key: tailwindcss-${{ inputs.tail_wind_labs_version }}-macos-aarch64

      - name: 下载 tailwind_labs 打包程序
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/tailwindlabs/tailwindcss/releases/download/${{ inputs.tail_wind_labs_version }}/tailwindcss-macos-arm64
          
          mv tailwindcss-macos-arm64 tailwindcss-macos-aarch64
          
          chmod +x tailwindcss-macos-aarch64

      - name: 处理 web 文件
        run: |
          cp -r esurfingclient/main/portal ./
          mkdir -p portal/assets/css

          wget --tries=5 --waitretry=3 -O portal/assets/js/alpine.js https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js
          wget --tries=5 --waitretry=3 -O portal/daisyui.mjs https://github.com/saadeghi/daisyui/releases/latest/download/daisyui.mjs

          ./tailwindcss-macos-aarch64 -i portal/input.css -o portal/assets/css/tailwind.css --minify
          rm portal/input.css
          rm portal/daisyui.mjs

          sed -i '' '/daisyui@5\/themes.css/d' portal/index.html
          sed -i '' 's#https://cdn.jsdelivr.net/npm/daisyui@5#assets/css/tailwind.css#g' portal/index.html
          sed -i '' 's#<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>##g' portal/index.html
          sed -i '' 's#https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js#assets/js/alpine.js#g' portal/index.html

          if grep -nE 'cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|fonts\.googleapis\.com' portal/index.html; then
            echo "[错误] index.html 里还有 CDN 引用, 脱机时会加载失败"
            exit 1
          fi
          grep -q 'href="assets/css/tailwind.css"' portal/index.html || { echo "[错误] index.html 未引用 assets/css/tailwind.css"; exit 1; }
          grep -q 'src="assets/js/alpine.js"' portal/index.html || { echo "[错误] index.html 未引用 assets/js/alpine.js"; exit 1; }
          test -s portal/assets/css/tailwind.css || { echo "[错误] tailwind.css 未生成"; exit 1; }
          test -s portal/assets/js/alpine.js || { echo "[错误] alpine.js 未下载"; exit 1; }
          echo "web 文件处理完成 (CDN 引用已全部替换为本地文件)"
          ls -l portal/assets/css/tailwind.css portal/assets/js/alpine.js

      - name: 复制配置文件到根目录
        run: |
          cp esurfingclient/config/ESurfingClient.json ./ESurfingClient.json

      - name: 打包成 tar.gz
        run: |
          tar -czf esurfingclient-${{ inputs.full_version }}-darwin-aarch64.tar.gz ESurfingClient-${{ inputs.full_version }}-darwin-aarch64 ESurfingClient.json portal/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: esurfingclient-${{ inputs.full_version }}-darwin-aarch64
          path: esurfingclient-${{ inputs.full_version }}-darwin-aarch64.tar.gz
          retention-days: 30
