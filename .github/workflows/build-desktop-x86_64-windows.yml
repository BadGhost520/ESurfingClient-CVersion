name: Build Desktop x86_64 Windows Binary

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_version:
        required: true
        type: string
      curl_version:
        required: true
        type: string
      tail_wind_labs_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:13

    steps:
      - uses: actions/checkout@v7

      - name: 安装软件包 (最多重试 3 次)
        run: |
          PACKAGES="cmake make ninja-build gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools upx-ucl wget file zip perl libperl-dev"

          for i in 1 2 3; do
            echo "尝试 $i: 正在安装 $PACKAGES"
            if apt-get update && apt-get install -y $PACKAGES; then
              echo "所有软件包已完成安装"
              break
            fi
            echo "尝试 $i 失败"
            sleep 3
          done

      - name: 创建工具链
        run: |
          cd esurfingclient/main
          
          cat > toolchain-mingw64.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          
          set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
          
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: 获取 libcurl 缓存
        id: cache-curl
        uses: actions/cache@v6
        with:
          path: |
            /usr/x86_64-w64-mingw32/lib/libcurl.a
            /usr/x86_64-w64-mingw32/include/curl
          key: curl-${{ inputs.curl_version }}-mingw64-x86_64

      - name: 构建 libcurl 静态链接库
        if: steps.cache-curl.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget https://curl.se/download/curl-${{ inputs.curl_version }}.tar.gz
          tar -xzf curl-${{ inputs.curl_version }}.tar.gz
          cd curl-${{ inputs.curl_version }}
          
          ./configure --host=x86_64-w64-mingw32 \
            --prefix=/usr/x86_64-w64-mingw32 \
            --enable-static \
            --disable-shared \
            --without-ssl \
            --enable-http \
            --enable-proxy \
            --enable-cookies \
            --enable-basic-auth \
            --enable-digest-auth \
            --disable-ftp \
            --disable-file \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smb \
            --disable-smtp \
            --disable-gopher \
            --disable-mqtt \
            --disable-websockets \
            --disable-bearer-auth \
            --disable-kerberos-auth \
            --disable-negotiate-auth \
            --disable-ntlm \
            --disable-tls-srp \
            --disable-aws \
            --disable-rtmp \
            --without-brotli \
            --without-zstd \
            --without-libpsl \
            --without-libssh2 \
            --without-librtmp \
            --without-libidn2 \
            --without-nghttp2 \
            --without-ngtcp2 \
            --without-nghttp3 \
            --without-quiche \
            --without-msh3 \
            --without-libgsasl \
            --without-libssh \
            --without-wolfssh \
            --without-hyper \
            --without-zlib \
            --disable-ares \
            --disable-rt \
            --disable-threaded-resolver \
            --disable-ipv6 \
            --disable-manual \
            --disable-docs \
            --disable-verbose \
            --disable-versioned-symbols \
            --disable-sspi
          
          make -j$(nproc)
          make install

      - name: 构建 ESurfingClient 程序
        run: |
          cd esurfingclient/main
          
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw64.cmake \
            -DBUILD_SHARED_LIBS=OFF \
            -B build \
            -S .
          
          cmake --build build -j$(nproc)
          
          cp build/ESurfingClient.exe ../../ESurfingClient-${{ inputs.full_version }}-windows-x86_64.exe
          
          x86_64-w64-mingw32-objdump -p ../../ESurfingClient-${{ inputs.full_version }}-windows-x86_64.exe | grep "DLL Name" | head -20
          
          upx --best --lzma ../../ESurfingClient-${{ inputs.full_version }}-windows-x86_64.exe || true
          
          ls -lh ../../ESurfingClient-${{ inputs.full_version }}-windows-x86_64.exe

      - name: 验证
        run: |
          if [ -f "ESurfingClient-${{ inputs.full_version }}-windows-x86_64.exe" ]; then
            echo "构建成功"
            echo "文件大小: $(stat -c%s ESurfingClient-${{ inputs.full_version }}-windows-x86_64.exe) bytes"

            echo "检查依赖:"
            deps=$(x86_64-w64-mingw32-objdump -p ESurfingClient-${{ inputs.full_version }}-windows-x86_64.exe | grep "DLL Name" || true)
            echo "$deps" | head -20

            if echo "$deps" | grep -qE "libcurl|libssl|libcrypto|libssh2|libnghttp2|libzstd|libidn2|libpsl|libbrotli|libunistring|libiconv"; then
              echo "错误: 链接了第三方动态库"
              echo "$deps" | grep -E "libcurl|libssl|libcrypto|libssh2|libnghttp2|libzstd|libidn2|libpsl|libbrotli|libunistring|libiconv"
              exit 1
            else
              echo "完全静态: 没有链接第三方动态库"
            fi
          else
            echo "未找到二进制文件"
            exit 1
          fi

      - name: 获取 web 处理缓存
        id: cache-web
        uses: actions/cache@v6
        with:
          path: tailwindcss-linux-x64
          key: tailwindcss-${{ inputs.tail_wind_labs_version }}-linux-x86_64

      - name: 下载 tailwind_labs 打包程序
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/tailwindlabs/tailwindcss/releases/download/${{ inputs.tail_wind_labs_version }}/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64

      - name: 处理 web 文件
        run: |
          cp -r esurfingclient/main/portal ./
          mkdir -p portal/assets/css

          # 本地调试时页面用的是 CDN, 这里把它换成本地文件 (发布的页面必须在脱机状态下使用)
          wget --tries=5 --waitretry=3 -O portal/assets/js/alpine.js https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js
          wget --tries=5 --waitretry=3 -O portal/daisyui.mjs https://github.com/saadeghi/daisyui/releases/latest/download/daisyui.mjs

          ./tailwindcss-linux-x64 -i portal/input.css -o portal/assets/css/output.css --minify
          rm portal/input.css
          rm portal/daisyui.mjs

          # 1) themes.css 独占一行, 整行删掉 (必须放在替换 URL 之前: 否则那条 sed 匹配不到,
          #    还会把标签删成没有 ">" 的残缺形式, 把后面的 <style> 一起吞掉)
          sed -i '/daisyui@5\/themes.css/d' portal/index.html
          # 2) daisyUI 主样式 -> 本地 output.css (light / synthwave 主题已编进 output.css)
          sed -i 's#https://cdn.jsdelivr.net/npm/daisyui@5#assets/css/output.css#g' portal/index.html
          # 3) 去掉只有联网才能用的 Tailwind 浏览器版
          sed -i 's#<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>##g' portal/index.html
          # 4) Alpine.js -> 本地
          sed -i 's#https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js#assets/js/alpine.js#g' portal/index.html

          # 自检: 打包产物里不允许残留任何 CDN 引用, 本地资源必须齐全
          if grep -nE 'cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|fonts\.googleapis\.com' portal/index.html; then
            echo "[错误] index.html 里还有 CDN 引用, 脱机时会加载失败"
            exit 1
          fi
          grep -q 'href="assets/css/output.css"' portal/index.html || { echo "[错误] index.html 未引用 assets/css/output.css"; exit 1; }
          grep -q 'src="assets/js/alpine.js"' portal/index.html || { echo "[错误] index.html 未引用 assets/js/alpine.js"; exit 1; }
          test -s portal/assets/css/output.css || { echo "[错误] output.css 未生成"; exit 1; }
          test -s portal/assets/js/alpine.js || { echo "[错误] alpine.js 未下载"; exit 1; }
          echo "web 文件处理完成 (CDN 引用已全部替换为本地文件)"
          ls -l portal/assets/css/output.css portal/assets/js/alpine.js

      - name: 复制配置文件到根目录
        run: |
          cp esurfingclient/config/ESurfingClient.json ./ESurfingClient.json

      - name: 打包成 zip 压缩包
        run: |
          zip -r esurfingclient-${{ inputs.full_version }}-windows-x86_64.zip ESurfingClient-${{ inputs.full_version }}-windows-x86_64.exe ESurfingClient.json portal/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: esurfingclient-${{ inputs.full_version }}-windows-x86_64
          path: esurfingclient-${{ inputs.full_version }}-windows-x86_64.zip
          retention-days: 30
