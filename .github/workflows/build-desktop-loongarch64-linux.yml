name: Build Desktop loongarch64 Linux Binary

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_version:
        required: true
        type: string
      openssl_version:
        required: true
        type: string
      curl_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:13

    steps:
      - uses: actions/checkout@v7

      - name: 安装软件包 (最多重试 3 次)
        run: |
          PACKAGES="build-essential cmake wget make gcc-loongarch64-linux-gnu g++-loongarch64-linux-gnu binutils-loongarch64-linux-gnu upx-ucl binutils file"

          for i in 1 2 3; do
            echo "尝试 $i: 正在安装 $PACKAGES"
            if apt-get update && apt-get install -y $PACKAGES; then
              echo "✅ 所有软件包已完成安装"
              break
            fi
            echo "❌ 尝试 $i 失败"
            sleep 3
          done

      - name: 创建工具链
        run: |
          cd esurfingclient/main

          cat > toolchain-loongarch64.cmake << 'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR loongarch64)

          set(CMAKE_C_COMPILER loongarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER loongarch64-linux-gnu-g++)

          set(CMAKE_FIND_ROOT_PATH /usr/loongarch64-linux-gnu)

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: 获取 OpenSSL 缓存
        id: cache-openssl
        uses: actions/cache@v6
        with:
          path: |
            /usr/loongarch64-linux-gnu/lib/libcrypto.a
            /usr/loongarch64-linux-gnu/include/openssl
          key: openssl-${{ inputs.openssl_version }}-loongarch64-linux

      - name: 构建 libOpenSSL 静态链接库
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget https://github.com/openssl/openssl/releases/download/openssl-${{ inputs.openssl_version }}/openssl-${{ inputs.openssl_version }}.tar.gz
          tar -xzf openssl-${{ inputs.openssl_version }}.tar.gz
          cd openssl-${{ inputs.openssl_version }}

          ./Configure linux64-loongarch64 \
            --cross-compile-prefix=loongarch64-linux-gnu- \
            --prefix=/usr/loongarch64-linux-gnu \
            --libdir=lib \
            no-shared \
            no-asm \
            no-tests \
            no-docs \
            no-apps \
            no-tls \
            no-bf \
            no-cast \
            no-idea \
            no-rc2 \
            no-rc4 \
            no-rc5 \
            no-seed \
            no-aria \
            no-camellia \
            no-sm2 \
            no-sm3 \
            no-mdc2 \
            no-rmd160 \
            no-whirlpool \
            no-blake2 \
            no-md4 \
            no-dtls \
            no-quic \
            no-sctp \
            no-srp \
            no-zlib \
            no-zstd \
            no-brotli \
            no-ktls \
            no-rdrand \
            no-asan \
            no-msan \
            no-ubsan \
            no-trace \
            no-egd \
            no-krb5kdf \
            no-scrypt \
            no-x942kdf \
            no-x963kdf \
            no-srtp \
            no-ocsp \
            no-cms \
            no-ts

          make -j$(nproc)
          make install

      - name: 获取 libcurl 缓存
        id: cache-curl
        uses: actions/cache@v6
        with:
          path: |
            /usr/loongarch64-linux-gnu/lib/libcurl.a
            /usr/loongarch64-linux-gnu/include/curl
          key: curl-${{ inputs.curl_version }}-loongarch64-linux

      - name: 构建 libcurl 静态链接库
        if: steps.cache-curl.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget https://curl.se/download/curl-${{ inputs.curl_version }}.tar.gz
          tar -xzf curl-${{ inputs.curl_version }}.tar.gz
          cd curl-${{ inputs.curl_version }}

          ./configure --host=loongarch64-linux-gnu \
            --prefix=/usr/loongarch64-linux-gnu \
            --enable-static \
            --disable-shared \
            --without-ssl \
            --enable-http \
            --enable-proxy \
            --enable-cookies \
            --enable-basic-auth \
            --enable-digest-auth \
            --disable-ftp \
            --disable-file \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smb \
            --disable-smtp \
            --disable-gopher \
            --disable-mqtt \
            --disable-websockets \
            --disable-bearer-auth \
            --disable-kerberos-auth \
            --disable-negotiate-auth \
            --disable-ntlm \
            --disable-tls-srp \
            --disable-aws \
            --disable-rtmp \
            --without-brotli \
            --without-zstd \
            --without-libpsl \
            --without-libssh2 \
            --without-librtmp \
            --without-libidn2 \
            --without-nghttp2 \
            --without-ngtcp2 \
            --without-nghttp3 \
            --without-quiche \
            --without-msh3 \
            --without-libgsasl \
            --without-libssh \
            --without-wolfssh \
            --without-hyper \
            --without-zlib \
            --disable-ares \
            --disable-rt \
            --disable-threaded-resolver \
            --disable-ipv6 \
            --disable-unix-sockets \
            --disable-manual \
            --disable-docs \
            --disable-verbose \
            --disable-versioned-symbols

          make -j$(nproc)
          make install

      - name: 构建 ESurfingClient 程序
        run: |
          cd esurfingclient/main

          cmake -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-loongarch64.cmake \
            -DBUILD_SHARED_LIBS=OFF \
            -B build \
            -S .

          cmake --build build -j$(nproc)

          cp build/ESurfingClient ../../ESurfingClient-${{ inputs.full_version }}-linux-loongarch64

          loongarch64-linux-gnu-strip ../../ESurfingClient-${{ inputs.full_version }}-linux-loongarch64

          upx --best --lzma ../../ESurfingClient-${{ inputs.full_version }}-linux-loongarch64 || true

          ls -lh ../../ESurfingClient-${{ inputs.full_version }}-linux-loongarch64

      - name: 验证
        run: |
          if [ -f "ESurfingClient-${{ inputs.full_version }}-linux-loongarch64" ]; then
            echo "✅ 构建成功"
            echo "📏 文件大小: $(du -h ESurfingClient-${{ inputs.full_version }}-linux-loongarch64 | cut -f1)"
            file ESurfingClient-${{ inputs.full_version }}-linux-loongarch64
          else
            echo "❌ 未找到二进制文件"
            exit 1
          fi

      - name: 打包成 tar.gz 压缩包
        run: |
          tar -czf esurfingclient-${{ inputs.full_version }}-linux-loongarch64.tar.gz ESurfingClient-${{ inputs.full_version }}-linux-loongarch64

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: esurfingclient-${{ inputs.full_version }}-linux-loongarch64
          path: esurfingclient-${{ inputs.full_version }}-linux-loongarch64.tar.gz
          retention-days: 30
