name: Build OpenWRT LuCI packages

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        required: true
        type: string
      sdk_version:
        required: true
        type: string
      target:
        required: true
        type: string
      package_type:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:${{ inputs.target }}-${{ inputs.sdk_version }}
      options: --user root

    steps:
      - uses: actions/checkout@v7

      - name: 同步版本号
        run: |
          bash scripts/sync-version.sh "${{ inputs.version }}-r${{ inputs.release }}"

      - name: 缓存 GPG 密钥环
        id: cache-gnupg
        uses: actions/cache@v6
        with:
          path: /github/home/.gnupg
          key: openwrt-gnupg-keys-v1

      - name: 导入 OpenWrt GPG 公钥
        if: steps.cache-gnupg.outputs.cache-hit != 'true'
        run: |
          gpg --keyserver keyserver.ubuntu.com --recv-keys \
            0xCD84BCED626471F1 \
            0x1D53D1877742E911 \
            0xCD54E82DADB3684D \
            0x28A39BC32074BE7A \
            0x88CA59E88F681580

      - name: 缓存 feeds 索引
        id: cache-feeds
        uses: actions/cache@v6
        with:
          path: /builder/feeds/
          key: openwrt-luci-feeds-v2-${{ inputs.sdk_version }}

      - name: 缓存 SDK 编译产物
        id: cache-luci-sdk
        uses: actions/cache@v6
        with:
          path: |
            /builder/dl/
            /builder/staging_dir/
          key: openwrt-luci-sdk-v2-${{ inputs.package_type }}-${{ inputs.sdk_version }}

      - name: 初始化 SDK
        run: |
          cd /builder
          [ -f .config ] || make defconfig

      - name: 更新 feeds 并安装 luci-base
        run: |
          cd /builder
          scripts/feeds update -a
          scripts/feeds install luci-base
          make defconfig

      - name: 编译 luci-app-esurfingclient
        run: |
          cp -r $GITHUB_WORKSPACE/luci-app-esurfingclient /builder/package/
          cd /builder
          scripts/feeds install luci-app-esurfingclient
          make package/luci-app-esurfingclient/compile V=sc -j$(nproc)
          find bin/packages -name "luci-app-esurfingclient*.${{ inputs.package_type }}" \
            -exec cp {} $GITHUB_WORKSPACE/luci-app-esurfingclient_${{ inputs.version }}-${{ inputs.release }}_all.${{ inputs.package_type }} \;

      - name: OpenWRT APK 包签名
        if: inputs.package_type == 'apk'
        run: |
          cd /builder
          cat > /tmp/openwrt-apk-private-key.pem << 'EOF'
          ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
          EOF
          chmod 600 /tmp/openwrt-apk-private-key.pem
          staging_dir/host/bin/apk adbsign --allow-untrusted \
            --sign-key /tmp/openwrt-apk-private-key.pem \
            $GITHUB_WORKSPACE/luci-app-esurfingclient_${{ inputs.version }}-${{ inputs.release }}_all.${{ inputs.package_type }}

      - name: 上传工件
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-esurfingclient_${{ inputs.version }}-${{ inputs.release }}_all-${{ inputs.package_type }}
          path: luci-app-esurfingclient_${{ inputs.version }}-${{ inputs.release }}_all.${{ inputs.package_type }}
          retention-days: 30