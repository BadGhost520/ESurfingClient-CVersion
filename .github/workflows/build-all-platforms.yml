name: Build All Platforms

permissions:
  actions: write
  contents: write

env:
  CURL_VERSION: "8.20.0"
  OPENWRT_IPK_SDK_VERSION: "24.10.8"
  OPENWRT_APK_SDK_VERSION: "25.12.5"
  TAIL_WIND_LABS_VERSION: "v4.3.0"

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '选择要构建的平台'
        type: choice
        required: true
        default: 'all'
        options:
          - all
          - windows-x86_64
          - linux-x86_64
          - macos-x86_64
          - macos-arm64
          - openwrt-luci-ipk
          - openwrt-luci-apk
          - openwrt-aarch64_cortex-a53-ipk
          - openwrt-aarch64_cortex-a53-apk
          - openwrt-aarch64_cortex-a72-ipk
          - openwrt-aarch64_cortex-a72-apk
          - openwrt-aarch64_generic-ipk
          - openwrt-aarch64_generic-apk
          - openwrt-mipsel_24kc-ipk
          - openwrt-mipsel_24kc-apk
          - openwrt-x86_64-ipk
          - openwrt-x86_64-apk

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      full_version: ${{ steps.version.outputs.full_version }}
      curl_version: ${{ env.CURL_VERSION }}
      openwrt_ipk_sdk_version: ${{ env.OPENWRT_IPK_SDK_VERSION }}
      openwrt_apk_sdk_version: ${{ env.OPENWRT_APK_SDK_VERSION }}
      tail_wind_labs_version: ${{ env.TAIL_WIND_LABS_VERSION }}
      ipk_matrix: ${{ steps.matrix.outputs.ipk_matrix }}
      apk_matrix: ${{ steps.matrix.outputs.apk_matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: 获取版本号
        id: version
        run: |
          cd esurfingclient/main
          MAJOR=$(grep -oP 'set\(PROGRAM_VERSION_MAJOR \K\d+' CMakeLists.txt)
          MINOR=$(grep -oP 'set\(PROGRAM_VERSION_MINOR \K\d+' CMakeLists.txt)
          PATCH=$(grep -oP 'set\(PROGRAM_VERSION_PATCH \K\d+' CMakeLists.txt)
          RELEASE=$(grep -oP 'set\(PROGRAM_VERSION_RELEASE \K\d+' CMakeLists.txt)
          
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "release=${RELEASE}" >> $GITHUB_OUTPUT
          echo "full_version=${MAJOR}.${MINOR}.${PATCH}-r${RELEASE}" >> $GITHUB_OUTPUT

      - name: 生成动态矩阵
        id: matrix
        shell: bash
        env:
          INPUT: ${{ github.event.inputs.platforms }}
        run: |
          set -euo pipefail

          ALL='[
            {"target":"bcm27xx/bcm2710","architecture":"aarch64_cortex-a53"},
            {"target":"bcm27xx/bcm2711","architecture":"aarch64_cortex-a72"},
            {"target":"armsr/armv8","architecture":"aarch64_generic"},
            {"target":"malta/le","architecture":"mipsel_24kc"},
            {"target":"x86/64","architecture":"x86_64"}
          ]'

          gen() {
            local suffix="$1"

            if [ "$INPUT" = "all" ]; then
              printf '%s' "$ALL"
              return
            fi

            if [[ "$INPUT" == openwrt-*-"$suffix" && "$INPUT" != openwrt-luci-* ]]; then
              local arch="${INPUT#openwrt-}"
              arch="${arch%-$suffix}"
              printf '%s' "$ALL" \
                | jq -c --arg a "$arch" '[.[] | select(.architecture == $a)]'
            else
              printf '[]'
            fi
          }

          IPK=$(gen ipk)
          APK=$(gen apk)
          echo "ipk_matrix=$IPK" >> "$GITHUB_OUTPUT"
          echo "apk_matrix=$APK" >> "$GITHUB_OUTPUT"
          echo "IPK 矩阵: $IPK"
          echo "APK 矩阵: $APK"

  # 桌面端
  windows-x86_64:
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows-x86_64'
    uses: ./.github/workflows/build-desktop-x86_64-windows.yml
    secrets: inherit
    needs: get-version
    with:
      full_version: ${{ needs.get-version.outputs.full_version }}
      curl_version: ${{ needs.get-version.outputs.curl_version }}
      tail_wind_labs_version: ${{ needs.get-version.outputs.tail_wind_labs_version }}

  linux-x86_64:
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux-x86_64'
    uses: ./.github/workflows/build-desktop-x86_64-linux.yml
    secrets: inherit
    needs: get-version
    with:
      full_version: ${{ needs.get-version.outputs.full_version }}
      curl_version: ${{ needs.get-version.outputs.curl_version }}
      tail_wind_labs_version: ${{ needs.get-version.outputs.tail_wind_labs_version }}

  macos-x86_64:
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos-x86_64'
    uses: ./.github/workflows/build-desktop-x86_64-macos.yml
    secrets: inherit
    needs: get-version
    with:
      full_version: ${{ needs.get-version.outputs.full_version }}
      curl_version: ${{ needs.get-version.outputs.curl_version }}
      tail_wind_labs_version: ${{ needs.get-version.outputs.tail_wind_labs_version }}

  macos-arm64:
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos-arm64'
    uses: ./.github/workflows/build-desktop-arm64-macos.yml
    secrets: inherit
    needs: get-version
    with:
      full_version: ${{ needs.get-version.outputs.full_version }}
      curl_version: ${{ needs.get-version.outputs.curl_version }}
      tail_wind_labs_version: ${{ needs.get-version.outputs.tail_wind_labs_version }}

  # LuCI
  openwrt-luci-ipk:
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'openwrt-luci-ipk'
    uses: ./.github/workflows/build-openwrt-luci-ipk-all.yml
    secrets: inherit
    needs: get-version
    with:
      version: ${{ needs.get-version.outputs.version }}
      release: ${{ needs.get-version.outputs.release }}
      sdk_version: ${{ needs.get-version.outputs.openwrt_ipk_sdk_version }}

  openwrt-luci-apk:
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'openwrt-luci-apk'
    uses: ./.github/workflows/build-openwrt-luci-apk-all.yml
    secrets: inherit
    needs: get-version
    with:
      version: ${{ needs.get-version.outputs.version }}
      release: ${{ needs.get-version.outputs.release }}
      sdk_version: ${{ needs.get-version.outputs.openwrt_apk_sdk_version }}

  # OpenWRT IPK
  openwrt-packages-ipk:
    if: needs.get-version.outputs.ipk_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.get-version.outputs.ipk_matrix) }}
    uses: ./.github/workflows/build-openwrt-packages.yml
    secrets: inherit
    needs: get-version
    with:
      version:      ${{ needs.get-version.outputs.version }}
      release:      ${{ needs.get-version.outputs.release }}
      sdk_version:  ${{ needs.get-version.outputs.openwrt_ipk_sdk_version }}
      target:       ${{ matrix.target }}
      architecture: ${{ matrix.architecture }}
      package_type: ipk
  
  # OpenWRT APK
  openwrt-packages-apk:
    if: needs.get-version.outputs.apk_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.get-version.outputs.apk_matrix) }}
    uses: ./.github/workflows/build-openwrt-packages.yml
    secrets: inherit
    needs: get-version
    with:
      version:      ${{ needs.get-version.outputs.version }}
      release:      ${{ needs.get-version.outputs.release }}
      sdk_version:  ${{ needs.get-version.outputs.openwrt_apk_sdk_version }}
      target:       ${{ matrix.target }}
      architecture: ${{ matrix.architecture }}
      package_type: apk

  release:
    needs:
      - windows-x86_64
      - linux-x86_64
      - macos-x86_64
      - macos-arm64
      - openwrt-luci-ipk
      - openwrt-luci-apk
      - openwrt-packages-ipk
      - openwrt-packages-apk
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v7

      - name: 下载所有工件
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 列出所有下载的文件
        run: |
          echo "已下载工件:"
          find artifacts -type f \( -name "*.zip" -o -name "*.ipk" -o -name "*.apk" -o -name "*.tar.gz" \) | sort

      - name: 创建 Release 包
        run: |
          export TZ='Asia/Shanghai'
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          RELEASE_NAME="ESurfing Client Build - $(date +'%Y-%m-%d %H:%M:%S CST')"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          
          echo "Release 名称: ${RELEASE_NAME}"
          
          mkdir -p release_package
          
          find artifacts -type f \( -name "*.zip" -o -name "*.ipk" -o -name "*.apk" -o -name "*.tar.gz" \) -exec cp {} release_package/ \;
          
          cd release_package
          zip -r "../master-latest.zip" .
          cd ..
          
          echo "已创建压缩包: master-latest.zip"
          ls -lh "master-latest.zip"

      - name: 清理 GitHub Prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete master-latest -y --cleanup-tag

      - name: 创建 GitHub Prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 'master-latest'
          name: ${{ env.RELEASE_NAME }}
          files: master-latest.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
